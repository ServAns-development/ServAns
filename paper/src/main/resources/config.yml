# ServAns only needs the dashboard connection here.
# Everything else (collection, retention, maintenance, privacy, logging, theme)
# is configured per server on the dashboard and synced to the plugin.
server:
  id: ''
  name: 'Minecraft Server'
cloud:
  enabled: true
  url: 'https://servans.matumaka.com'
  key: ''
  timeout-seconds: 10
# Local plugin storage. The dashboard stores its own copy in MongoDB.
database:
  type: sqlite
  pool-size: 6
  file: servans.db
  mysql:
    host: 127.0.0.1
    port: 3306
    database: servans
    username: servans
    password: ''
    use-ssl: false
